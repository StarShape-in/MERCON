name: Build MERCON Driver APK

on:
  workflow_dispatch:
  push:
    branches: [ dev, main ]
    paths:
      - 'frontend/mobile-app/mercon-app/**'
      - '.github/workflows/build-driver-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/mobile-app/mercon-app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: frontend/mobile-app/mercon-app
        run: npm ci || npm install

      - name: Expo Prebuild (Generate Android native project)
        working-directory: frontend/mobile-app/mercon-app
        run: npx expo prebuild --platform android --no-install

      - name: Build Release APK
        working-directory: frontend/mobile-app/mercon-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Driver APK
        uses: actions/upload-artifact@v4
        with:
          name: mercon-driver-app
          path: frontend/mobile-app/mercon-app/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
