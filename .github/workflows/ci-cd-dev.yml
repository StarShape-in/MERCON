name: CI/CD Pipeline (Dev)

on:
  push:
    branches: [ "dev" ]

# See ci-cd.yml for why this exists: this runner queued overlapping runs on
# rapid successive pushes, and each one's actions/checkout download piled on
# top of the others until GitHub's per-IP rate limit (429) started failing
# runs outright. Queuing (not canceling) so a mid-flight `docker compose up
# --build` is never interrupted.
concurrency:
  group: ci-cd-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy dev stack to Self-Hosted Runner
    runs-on: self-hosted

    steps:
      # Native git instead of actions/checkout — see ci-cd.yml for why: this
      # runner's work directory persists between runs, so the marketplace
      # action bundle was being re-downloaded from codeload.github.com on
      # every deploy for no reason. git is already on the runner.
      - name: Checkout Code (native git — avoids actions/checkout download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if [ -d .git ]; then
            git remote set-url origin "$REPO_URL"
            git fetch --force --prune origin "$GITHUB_SHA"
            git checkout --force "$GITHUB_SHA"
            git clean -fdx
          else
            git init -q
            git remote add origin "$REPO_URL"
            git fetch --depth 1 origin "$GITHUB_SHA"
            git checkout --force FETCH_HEAD
          fi

      - name: Rebuild and Restart Dev Docker Containers
        env:
          # Isolated dev credentials — never shared with prod (see repo
          # secrets DEV_*). Compose project name -p mercon-dev keeps this
          # stack (containers, network, auto-named volume) fully separate
          # from the prod "mercon" project even though both check out into
          # the same runner work directory.
          CLIENT_NAME: dev
          POSTGRES_DB: mercon_dev_db
          POSTGRES_USER: ${{ secrets.DEV_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DEV_POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.DEV_JWT_SECRET }}
          SEED_ADMIN_PASSWORD: ${{ secrets.DEV_SEED_ADMIN_PASSWORD }}
          API_PORT: 3051
          FRONTEND_PORT: 3061
          DB_TUNNEL_PORT: 15433
          TMP_UPLOADS_DIR: /tmp/mercon-dev-tmp-uploads
          # ICCES / Google Maps intentionally left unset for dev — both are
          # optional integrations (see root docker-compose.yml comments) and
          # dev shouldn't poll the real GPS provider or spend Maps billing.
        run: |
          echo "Rebuilding dev backend and frontend services..."

          if [ -z "$JWT_SECRET" ]; then
            echo "ERROR: DEV_JWT_SECRET secret is not set in the repo. Aborting deploy." >&2
            exit 1
          fi
          if [ -z "$POSTGRES_USER" ] || [ -z "$POSTGRES_PASSWORD" ]; then
            echo "ERROR: DEV_POSTGRES_USER / DEV_POSTGRES_PASSWORD secrets are not set in the repo. Aborting deploy." >&2
            exit 1
          fi
          if [ -z "$SEED_ADMIN_PASSWORD" ]; then
            echo "ERROR: DEV_SEED_ADMIN_PASSWORD secret is not set in the repo. Aborting deploy." >&2
            exit 1
          fi

          mkdir -p /tmp/dev-uploads /tmp/mercon-dev-tmp-uploads
          chmod -R 777 /tmp/dev-uploads /tmp/mercon-dev-tmp-uploads 2>/dev/null || true

          docker compose -p mercon-dev up -d --build

          sleep 8
          echo "--- dev-api logs (last 100 lines) ---"
          docker compose -p mercon-dev logs --no-color --tail=100 mercon-api || true
          echo "--- dev-api container status ---"
          docker compose -p mercon-dev ps mercon-api || true
