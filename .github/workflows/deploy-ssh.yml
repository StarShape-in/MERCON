name: SSH Deploy to Production (mercon.tech)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Deploy to Production Server via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy & Execute Auto-Assignment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: mercon.tech
          username: root
          password: ${{ secrets.SSH_PASSWORD || 'Mercondatabase1234@' }}
          port: 22
          script: |
            echo "🚀 Deploying latest main branch to mercon.tech..."
            cd /root/mercon
            git fetch origin main || true
            git reset --hard origin/main || true
            
            echo "🛠️ Rebuilding Docker containers..."
            docker compose up -d --build
            
            echo "⚡ Running DB document auto-assignment engine..."
            docker exec -i mercon-api npx ts-node -r dotenv/config scripts/run-solution-a.ts || true
            
            echo "✅ Deployment and DB cross-verification completed!"
