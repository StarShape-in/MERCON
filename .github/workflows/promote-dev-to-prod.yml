name: Promote Dev Checkpoint to Production

# Isolated Release-Candidate Checkpoint & Production Promotion System
#
# Architecture:
# 1. DEV continuously receives development changes independently.
# 2. Stable DEV is captured as an immutable CHECKPOINT (Git SHA + Metadata).
# 3. If MAIN has diverged, an isolated RELEASE CANDIDATE (release/chk-...) is created from MAIN + Checkpoint.
# 4. DEV branch is NEVER modified or merged with MAIN.
# 5. Sentinel READ-ONLY Gate validates the release candidate before touching production.
# 6. Production database is backed up BEFORE any promotion steps.
# 7. Main branch is updated safely to the Release Candidate SHA (NO force push).
# 8. Version-controlled Prisma migrations are applied to production (mercon_db).
# 9. Production business data (trips, users, settings, drivers) remains 100% INTACT.
# 10. Production API container is restarted and verified with a FATAL health check.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type OVERWRITE PRODUCTION to confirm promotion.'
        required: true
        default: ''
        type: string
      mode:
        description: 'Action mode: "promote" (full backup + promotion) or "validate_only" (creates candidate & validates without touching prod)'
        required: true
        default: 'promote'
        type: choice
        options:
          - promote
          - validate_only

concurrency:
  group: ci-cd-main
  cancel-in-progress: false

jobs:
  checkpoint-promote:
    name: Isolated Checkpoint & Production Promotion
    runs-on: self-hosted

    steps:
      - name: Verify Confirmation Phrase
        run: |
          set -euo pipefail
          RAW_CONFIRM="${{ inputs.confirm }}"
          CLEAN_CONFIRM=$(echo "$RAW_CONFIRM" | sed 's/ to proceed\.//i' | xargs)
          
          if [ "${{ inputs.mode }}" = "promote" ]; then
            if [ "$CLEAN_CONFIRM" != "OVERWRITE PRODUCTION" ]; then
              echo "::error::Confirmation phrase did not match 'OVERWRITE PRODUCTION'. Received: '$RAW_CONFIRM'. Aborting — no data was touched." >&2
              exit 1
            fi
            echo "Confirmation phrase validated successfully for promotion."
          else
            echo "Running in validate_only mode. Proceeding with Checkpoint creation and Sentinel validation."
          fi

      - name: Native Git Checkout & Pinned Checkpoint SHA Extraction
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0=safe.directory
          export GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE"
          export GIT_CONFIG_KEY_1=user.name
          export GIT_CONFIG_VALUE_1="MERCON Checkpoint Bot"
          
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if [ -d .git ]; then
            git remote set-url origin "$REPO_URL"
            git fetch --force --prune origin dev main
            git checkout --force origin/dev
          else
            git init -q
            git remote add origin "$REPO_URL"
            git fetch --depth 100 origin dev main
            git checkout --force FETCH_HEAD
          fi
          
          CHECKPOINT_COMMIT_SHA=$(git rev-parse HEAD)
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          CHECKPOINT_ID="chk-${STAMP}-${CHECKPOINT_COMMIT_SHA:0:7}"
          
          echo "CHECKPOINT_COMMIT_SHA=$CHECKPOINT_COMMIT_SHA" >> "$GITHUB_ENV"
          echo "CHECKPOINT_ID=$CHECKPOINT_ID" >> "$GITHUB_ENV"
          echo "CHECKPOINT_STAMP=$STAMP" >> "$GITHUB_ENV"
          
          echo "Checkpoint SHA: $CHECKPOINT_COMMIT_SHA"
          echo "Checkpoint ID:  $CHECKPOINT_ID"

      - name: Prepare Isolated Release Candidate Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "=========================================="
          echo "PREPARING ISOLATED RELEASE CANDIDATE"
          echo "=========================================="
          
          git fetch origin main || true
          MAIN_SHA=$(git rev-parse origin/main 2>/dev/null || echo "NONE")
          DEV_SHA="$CHECKPOINT_COMMIT_SHA"
          
          RELEASE_BRANCH="release/${CHECKPOINT_ID}"
          
          if [ "$MAIN_SHA" != "NONE" ]; then
            if git merge-base --is-ancestor origin/main "$DEV_SHA"; then
              echo "Branch Ancestry: MAIN ($MAIN_SHA) is a fast-forward ancestor of Checkpoint ($DEV_SHA)."
              RELEASE_TARGET_SHA="$DEV_SHA"
            else
              echo "Branch Ancestry: MAIN ($MAIN_SHA) has diverged from Checkpoint ($DEV_SHA)."
              echo "Creating isolated release candidate branch $RELEASE_BRANCH from MAIN..."
              
              git checkout -B "$RELEASE_BRANCH" origin/main
              git merge "$DEV_SHA" -m "release: merge checkpoint $CHECKPOINT_ID into main"
              
              RELEASE_TARGET_SHA=$(git rev-parse HEAD)
              echo "Isolated Release Candidate created with SHA: $RELEASE_TARGET_SHA"
              echo "DEV branch remains 100% untouched and independent."
            fi
          else
            echo "Branch Ancestry: Initializing MAIN from Checkpoint."
            RELEASE_TARGET_SHA="$DEV_SHA"
          fi
          
          echo "RELEASE_TARGET_SHA=$RELEASE_TARGET_SHA" >> "$GITHUB_ENV"
          echo "RELEASE_BRANCH=$RELEASE_BRANCH" >> "$GITHUB_ENV"

      - name: Sentinel READ-ONLY Release Candidate Drift Analysis
        env:
          DEV_POSTGRES_USER: ${{ secrets.DEV_POSTGRES_USER || secrets.POSTGRES_USER || 'mercon_dev_admin' }}
          DEV_POSTGRES_PASSWORD: ${{ secrets.DEV_POSTGRES_PASSWORD || secrets.POSTGRES_PASSWORD || 'mercon_dev_secure_pass_2026' }}
          PROD_POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          PROD_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          echo "=========================================="
          echo "SENTINEL READ-ONLY DRIFT & AUDIT ANALYSIS"
          echo "=========================================="
          
          git checkout "$RELEASE_TARGET_SHA"
          
          # Initialize default state as BLOCKED
          VERDICT="PROMOTION_BLOCKED"
          DEV_STATUS="VERIFICATION_FAILED"
          PROD_STATUS="VERIFICATION_FAILED"
          DEV_FAILED_COUNT="N/A"
          PROD_FAILED_COUNT="N/A"
          DEV_TABLE_COUNT="N/A"
          PROD_TABLE_COUNT="N/A"
          
          # 1. DEV DATABASE VERIFICATION
          if [ -z "${DEV_POSTGRES_USER:-}" ] || [ -z "${DEV_POSTGRES_PASSWORD:-}" ]; then
            echo "::error::DEV PostgreSQL credentials missing." >&2
          else
            if docker exec -e PGPASSWORD="$DEV_POSTGRES_PASSWORD" dev-postgres psql -U "$DEV_POSTGRES_USER" -d mercon_dev_db -c "SELECT 1;" >/dev/null 2>&1; then
              DEV_RAW=$(docker exec -e PGPASSWORD="$DEV_POSTGRES_PASSWORD" dev-postgres psql -U "$DEV_POSTGRES_USER" -d mercon_dev_db -t -c "
                SELECT COUNT(*) FROM _prisma_migrations WHERE finished_at IS NULL AND rolled_back_at IS NULL;
              " 2>/dev/null | tr -d '[:space:]' || echo "FAILED")
              
              if [[ "$DEV_RAW" =~ ^[0-9]+$ ]]; then
                DEV_FAILED_COUNT="$DEV_RAW"
                if [ "$DEV_FAILED_COUNT" -eq 0 ]; then
                  DEV_STATUS="VERIFIED_CLEAN"
                else
                  DEV_STATUS="VERIFIED_PROBLEM"
                fi
              else
                echo "::error::DEV migration query returned non-integer output: '$DEV_RAW'" >&2
              fi
              
              DEV_TABLE_RAW=$(docker exec -e PGPASSWORD="$DEV_POSTGRES_PASSWORD" dev-postgres psql -U "$DEV_POSTGRES_USER" -d mercon_dev_db -t -c "
                SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';
              " 2>/dev/null | tr -d '[:space:]' || echo "N/A")
              if [[ "$DEV_TABLE_RAW" =~ ^[0-9]+$ ]]; then
                DEV_TABLE_COUNT="$DEV_TABLE_RAW"
              fi
            else
              echo "::error::DEV PostgreSQL database unreachable or container unavailable." >&2
            fi
          fi
          
          # 2. PROD DATABASE VERIFICATION (STRICT FAIL-CLOSED)
          if [ -z "${PROD_POSTGRES_USER:-}" ] || [ -z "${PROD_POSTGRES_PASSWORD:-}" ]; then
            echo "::error::PROD PostgreSQL secrets (POSTGRES_USER / POSTGRES_PASSWORD) missing or empty." >&2
          else
            if docker exec -e PGPASSWORD="$PROD_POSTGRES_PASSWORD" mercon-postgres psql -U "$PROD_POSTGRES_USER" -d mercon_db -c "SELECT 1;" >/dev/null 2>&1; then
              PROD_RAW=$(docker exec -e PGPASSWORD="$PROD_POSTGRES_PASSWORD" mercon-postgres psql -U "$PROD_POSTGRES_USER" -d mercon_db -t -c "
                SELECT COUNT(*) FROM _prisma_migrations WHERE finished_at IS NULL AND rolled_back_at IS NULL;
              " 2>/dev/null | tr -d '[:space:]' || echo "FAILED")
              
              if [[ "$PROD_RAW" =~ ^[0-9]+$ ]]; then
                PROD_FAILED_COUNT="$PROD_RAW"
                if [ "$PROD_FAILED_COUNT" -eq 0 ]; then
                  PROD_STATUS="VERIFIED_CLEAN"
                else
                  PROD_STATUS="VERIFIED_PROBLEM"
                fi
              else
                echo "::error::PROD migration query returned non-integer output: '$PROD_RAW'" >&2
              fi
              
              PROD_TABLE_RAW=$(docker exec -e PGPASSWORD="$PROD_POSTGRES_PASSWORD" mercon-postgres psql -U "$PROD_POSTGRES_USER" -d mercon_db -t -c "
                SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';
              " 2>/dev/null | tr -d '[:space:]' || echo "N/A")
              if [[ "$PROD_TABLE_RAW" =~ ^[0-9]+$ ]]; then
                PROD_TABLE_COUNT="$PROD_TABLE_RAW"
              fi

              # 3. CANONICAL SENTINEL DOCTOR INTEGRITY AUDIT (Pending DDL Conflict & Schema Drift)
              PROD_CONTAINER_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' mercon-postgres 2>/dev/null | tr -d '[:space:]' || echo "")

              if [ -n "$PROD_CONTAINER_IP" ]; then
                PROD_DB_URL="postgresql://${PROD_POSTGRES_USER}:${PROD_POSTGRES_PASSWORD}@${PROD_CONTAINER_IP}:5432/mercon_db"
                echo "Executing Canonical Sentinel Doctor audit against Production DB container 'mercon-postgres' ($PROD_CONTAINER_IP:5432)..."
                if npm --prefix tools/sentinel run doctor -- --schema backend/api-server/prisma/schema.prisma --migrations backend/api-server/prisma/migrations --db-url "$PROD_DB_URL" --env PROD; then
                  echo "Canonical Sentinel Doctor audit: PASSED (Zero critical/high integrity violations)."
                else
                  echo "::error::Canonical Sentinel Doctor audit detected critical/high schema, migration, or physical DB conflicts." >&2
                  PROD_STATUS="VERIFIED_PROBLEM"
                fi
              else
                echo "::error::Unable to resolve exact Production PostgreSQL container 'mercon-postgres' IP for Sentinel inspection." >&2
                PROD_STATUS="VERIFICATION_FAILED"
              fi
            else
              echo "::error::PROD PostgreSQL database unreachable or container unavailable." >&2
            fi
          fi
          
          echo "Release Target SHA: $RELEASE_TARGET_SHA"
          echo "DEV Status:         $DEV_STATUS (Unresolved Failed Migrations: $DEV_FAILED_COUNT, Base Tables: $DEV_TABLE_COUNT)"
          echo "PROD Status:        $PROD_STATUS (Unresolved Failed Migrations: $PROD_FAILED_COUNT, Base Tables: $PROD_TABLE_COUNT)"
          
          if [ "$DEV_STATUS" = "VERIFIED_CLEAN" ] && [ "$PROD_STATUS" = "VERIFIED_CLEAN" ]; then
            VERDICT="PROMOTION_SAFE"
          else
            VERDICT="PROMOTION_BLOCKED"
          fi
          
          echo "SENTINEL PROMOTION VERDICT: $VERDICT"
          echo "SENTINEL_VERDICT=$VERDICT" >> "$GITHUB_ENV"
          
          if [ "$VERDICT" = "PROMOTION_BLOCKED" ]; then
            echo "::error::Sentinel Gate: Promotion BLOCKED due to database verification failure or unresolved migration ledger issues." >&2
            exit 1
          fi

      - name: Validate-Only Mode Early Completion
        if: ${{ inputs.mode == 'validate_only' }}
        run: |
          echo "## Checkpoint Validation Successful (Dry-Run)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Checkpoint ID: \`$CHECKPOINT_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Checkpoint SHA: \`$CHECKPOINT_COMMIT_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release Target SHA: \`$RELEASE_TARGET_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sentinel Gate Verdict: **$SENTINEL_VERDICT**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production: **UNTOUCHED**" >> "$GITHUB_STEP_SUMMARY"
          echo "- DEV Branch: **UNTOUCHED & INDEPENDENT**" >> "$GITHUB_STEP_SUMMARY"
          echo "Validation mode complete. No changes made to Production."

      - name: Backup Production Database (Pre-Promotion Safety Gate)
        if: ${{ inputs.mode == 'promote' }}
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$POSTGRES_USER" ] || [ -z "$POSTGRES_PASSWORD" ]; then
            echo "::error::POSTGRES_USER / POSTGRES_PASSWORD secrets missing. Aborting promotion." >&2
            exit 1
          fi
          
          mkdir -p /root/mercon-db-backups
          PROD_BACKUP_PATH="/root/mercon-db-backups/prod-before-promote-${CHECKPOINT_STAMP}.dump"
          echo "Dumping production (mercon_db) to $PROD_BACKUP_PATH ..."
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" mercon-postgres \
            pg_dump -U "$POSTGRES_USER" -d mercon_db -Fc -f "/tmp/prod-backup.dump"
          docker cp mercon-postgres:/tmp/prod-backup.dump "$PROD_BACKUP_PATH"
          docker exec mercon-postgres rm -f /tmp/prod-backup.dump
          
          if [ ! -s "$PROD_BACKUP_PATH" ]; then
            echo "::error::Production database backup failed or produced empty file. Aborting before touching production." >&2
            exit 1
          fi
          
          echo "PROD_BACKUP_PATH=$PROD_BACKUP_PATH" >> "$GITHUB_ENV"
          echo "Production backup complete: $PROD_BACKUP_PATH ($(du -h "$PROD_BACKUP_PATH" | cut -f1))"

      - name: Deploy Production Code & Apply Prisma Migrations to PROD Database
        if: ${{ inputs.mode == 'promote' }}
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          ICCES_USER: ${{ secrets.ICCES_USER }}
          ICCES_PASS: ${{ secrets.ICCES_PASS }}
          ICCES_ACCT: ${{ secrets.ICCES_ACCT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'AQ.Ab8RN6K3a4t83gB0yRI607axYGS8_JJIHhRuJZkYkLwxDDsNZA' }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-flash-latest' }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          echo "Deploying production stack for Release Target SHA $RELEASE_TARGET_SHA..."
          git checkout "$RELEASE_TARGET_SHA"
          
          echo "Building production Docker containers..."
          docker compose up -d --build
          
          sleep 8
          echo "Production containers running."

      - name: Fatal Production Health Verification
        if: ${{ inputs.mode == 'promote' }}
        run: |
          set -euo pipefail
          echo "Verifying production API health endpoint..."
          sleep 5
          
          HEALTH_RESPONSE=$(curl -fsS http://127.0.0.1:3050/health 2>/dev/null || curl -fsS http://localhost:3050/health 2>/dev/null || echo "FAILED")
          echo "Production Health Check Output: $HEALTH_RESPONSE"
          
          if [ "$HEALTH_RESPONSE" = "FAILED" ]; then
            echo "::error::Production API health check failed! Printing container logs..." >&2
            docker compose logs --tail=100 mercon-api || true
            echo "Rollback command: docker exec -e PGPASSWORD=\"\$POSTGRES_PASSWORD\" mercon-postgres pg_restore --clean --if-exists --no-owner --no-privileges -U \"\$POSTGRES_USER\" -d mercon_db < $PROD_BACKUP_PATH" >&2
            exit 1
          fi
          
          echo "Production API is HEALTHY."

      - name: Promote Main Branch to Release Target SHA (NO Force Push)
        if: ${{ inputs.mode == 'promote' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Promoting main branch to Release Target commit $RELEASE_TARGET_SHA..."
          git push origin "${RELEASE_TARGET_SHA}:refs/heads/main"
          echo "Branch main successfully updated to Release Target commit $RELEASE_TARGET_SHA."

      - name: Final Promotion Summary
        if: ${{ inputs.mode == 'promote' }}
        run: |
          {
            echo "## Dev Checkpoint → Production Promotion Complete"
            echo ""
            echo "- **Checkpoint ID**: \`$CHECKPOINT_ID\`"
            echo "- **Pinned Checkpoint SHA**: \`$CHECKPOINT_COMMIT_SHA\`"
            echo "- **Release Target SHA**: \`$RELEASE_TARGET_SHA\`"
            echo "- **Production Pre-Backup**: \`$PROD_BACKUP_PATH\`"
            echo "- **Main Branch**: Updated to \`$RELEASE_TARGET_SHA\`"
            echo "- **DEV Branch**: **100% UNTOUCHED & INDEPENDENT**"
            echo "- **Production Business Data**: **100% INTACT & PRESERVED**"
            echo "- **Sentinel Validation**: PASSED"
            echo "- **Production Health**: **HEALTHY (200 OK)**"
            echo ""
            echo "### Pre-Promotion Backup File"
            echo "\`$PROD_BACKUP_PATH\`"
          } >> "$GITHUB_STEP_SUMMARY"
