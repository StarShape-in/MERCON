name: Promote Dev Checkpoint to Production

# Safe DEV Checkpoint & Production Promotion System
#
# Architecture:
# 1. DEV continuously receives development changes.
# 2. Stable DEV is captured as an immutable CHECKPOINT (Git SHA + Metadata).
# 3. Sentinel READ-ONLY Gate validates DEV ↔ MAIN code, schema, and migration drift.
# 4. Production database is backed up BEFORE any promotion steps.
# 5. Main branch is fast-forwarded to the Checkpoint Git SHA (NO force push).
# 6. Version-controlled Prisma migrations are applied to production (mercon_db).
# 7. Production business data (trips, users, settings, drivers) remains 100% INTACT.
# 8. Production API container is restarted and verified with a FATAL health check.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type OVERWRITE PRODUCTION to confirm promotion.'
        required: true
        default: ''
        type: string
      mode:
        description: 'Action mode: "promote" (full backup + promotion) or "validate_only" (creates checkpoint & validates without touching prod)'
        required: true
        default: 'promote'
        type: choice
        options:
          - promote
          - validate_only

concurrency:
  group: ci-cd-main
  cancel-in-progress: false

jobs:
  checkpoint-promote:
    name: DEV Checkpoint & Production Promotion
    runs-on: self-hosted

    steps:
      - name: Verify Confirmation Phrase
        run: |
          set -euo pipefail
          RAW_CONFIRM="${{ inputs.confirm }}"
          CLEAN_CONFIRM=$(echo "$RAW_CONFIRM" | sed 's/ to proceed\.//i' | xargs)
          
          if [ "${{ inputs.mode }}" = "promote" ]; then
            if [ "$CLEAN_CONFIRM" != "OVERWRITE PRODUCTION" ]; then
              echo "::error::Confirmation phrase did not match 'OVERWRITE PRODUCTION'. Received: '$RAW_CONFIRM'. Aborting — no data was touched." >&2
              exit 1
            fi
            echo "Confirmation phrase validated successfully for promotion."
          else
            echo "Running in validate_only mode. Proceeding with Checkpoint creation and Sentinel validation."
          fi

      - name: Native Git Checkout & Pinned SHA Extraction
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=safe.directory
          export GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE"
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if [ -d .git ]; then
            git remote set-url origin "$REPO_URL"
            git fetch --force --prune origin dev main
            git checkout --force origin/dev
          else
            git init -q
            git remote add origin "$REPO_URL"
            git fetch --depth 100 origin dev main
            git checkout --force FETCH_HEAD
          fi
          
          CHECKPOINT_COMMIT_SHA=$(git rev-parse HEAD)
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          CHECKPOINT_ID="chk-${STAMP}-${CHECKPOINT_COMMIT_SHA:0:7}"
          
          echo "CHECKPOINT_COMMIT_SHA=$CHECKPOINT_COMMIT_SHA" >> "$GITHUB_ENV"
          echo "CHECKPOINT_ID=$CHECKPOINT_ID" >> "$GITHUB_ENV"
          echo "CHECKPOINT_STAMP=$STAMP" >> "$GITHUB_ENV"
          
          echo "Checkpoint SHA: $CHECKPOINT_COMMIT_SHA"
          echo "Checkpoint ID:  $CHECKPOINT_ID"

      - name: Sentinel READ-ONLY DEV ↔ MAIN / PROD Drift Analysis
        env:
          DEV_POSTGRES_USER: ${{ secrets.DEV_POSTGRES_USER || secrets.POSTGRES_USER || 'mercon_dev_admin' }}
          DEV_POSTGRES_PASSWORD: ${{ secrets.DEV_POSTGRES_PASSWORD || secrets.POSTGRES_PASSWORD || 'mercon_dev_secure_pass_2026' }}
          PROD_POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          PROD_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          echo "=========================================="
          echo "SENTINEL READ-ONLY DEV ↔ MAIN DRIFT ANALYSIS"
          echo "=========================================="
          
          # 1. CODE & BRANCH DRIFT
          git fetch origin main || true
          MAIN_SHA=$(git rev-parse origin/main 2>/dev/null || echo "NONE")
          DEV_SHA="$CHECKPOINT_COMMIT_SHA"
          
          echo "Checkpoint DEV SHA: $DEV_SHA"
          echo "Current MAIN SHA:   $MAIN_SHA"
          
          IS_ANCESTOR=false
          if [ "$MAIN_SHA" != "NONE" ]; then
            if git merge-base --is-ancestor origin/main "$DEV_SHA"; then
              IS_ANCESTOR=true
              echo "Branch Ancestry: MAIN ($MAIN_SHA) is a valid ancestor of DEV Checkpoint ($DEV_SHA)."
            else
              echo "::error::Sentinel Drift Alert: Branch MAIN has diverged from DEV Checkpoint SHA ($DEV_SHA). Fast-forward update impossible without losing MAIN history." >&2
            fi
          else
            IS_ANCESTOR=true
            echo "Branch Ancestry: Initializing MAIN from DEV Checkpoint."
          fi
          
          # 2. DEV MIGRATION LEDGER AUDIT
          DEV_FAILED_COUNT=$(docker exec -e PGPASSWORD="$DEV_POSTGRES_PASSWORD" dev-postgres psql -U "$DEV_POSTGRES_USER" -d mercon_dev_db -t -c "
            SELECT COUNT(*) FROM _prisma_migrations WHERE finished_at IS NULL AND rolled_back_at IS NULL;
          " | tr -d '[:space:]' || echo "1")
          
          # 3. PROD MIGRATION LEDGER AUDIT
          PROD_FAILED_COUNT=0
          if [ -n "$PROD_POSTGRES_PASSWORD" ]; then
            PROD_FAILED_COUNT=$(docker exec -e PGPASSWORD="$PROD_POSTGRES_PASSWORD" mercon-postgres psql -U "$PROD_POSTGRES_USER" -d mercon_db -t -c "
              SELECT COUNT(*) FROM _prisma_migrations WHERE finished_at IS NULL AND rolled_back_at IS NULL;
            " | tr -d '[:space:]' 2>/dev/null || echo "0")
          fi
          
          # 4. PHYSICAL SCHEMA COMPARISON (Table Count)
          DEV_TABLE_COUNT=$(docker exec -e PGPASSWORD="$DEV_POSTGRES_PASSWORD" dev-postgres psql -U "$DEV_POSTGRES_USER" -d mercon_dev_db -t -c "
            SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';
          " | tr -d '[:space:]' || echo "0")
          
          PROD_TABLE_COUNT=0
          if [ -n "$PROD_POSTGRES_PASSWORD" ]; then
            PROD_TABLE_COUNT=$(docker exec -e PGPASSWORD="$PROD_POSTGRES_PASSWORD" mercon-postgres psql -U "$PROD_POSTGRES_USER" -d mercon_db -t -c "
              SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';
            " | tr -d '[:space:]' 2>/dev/null || echo "0")
          fi
          
          echo "DEV Table Count:  $DEV_TABLE_COUNT"
          echo "PROD Table Count: $PROD_TABLE_COUNT"
          
          # 5. DETERMINATION OF SENTINEL PROMOTION VERDICT
          VERDICT="PROMOTION_SAFE"
          
          if [ "$IS_ANCESTOR" = "false" ]; then
            VERDICT="PROMOTION_BLOCKED"
            echo "::error::Verdict Reason: MAIN branch has diverged from DEV Checkpoint." >&2
          fi
          
          if [ "$DEV_FAILED_COUNT" -ne 0 ]; then
            VERDICT="PROMOTION_BLOCKED"
            echo "::error::Verdict Reason: DEV migration ledger contains $DEV_FAILED_COUNT un-resolved failed migration(s)." >&2
          fi
          
          if [ "$PROD_FAILED_COUNT" -ne 0 ]; then
            VERDICT="PROMOTION_BLOCKED"
            echo "::error::Verdict Reason: PROD migration ledger contains $PROD_FAILED_COUNT un-resolved failed migration(s)." >&2
          fi
          
          echo "SENTINEL PROMOTION VERDICT: $VERDICT"
          echo "SENTINEL_VERDICT=$VERDICT" >> "$GITHUB_ENV"
          
          if [ "$VERDICT" = "PROMOTION_BLOCKED" ]; then
            echo "::error::Sentinel Gate: Promotion BLOCKED due to critical branch divergence or ledger inconsistencies." >&2
            exit 1
          fi

      - name: Validate-Only Mode Early Completion
        if: ${{ inputs.mode == 'validate_only' }}
        run: |
          echo "## Checkpoint Validation Successful (Dry-Run)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Checkpoint ID: \`$CHECKPOINT_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Git SHA: \`$CHECKPOINT_COMMIT_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Main Ancestry: **PASSED (Fast-Forward Safe)**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sentinel Gate Verdict: **$SENTINEL_VERDICT**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production: **UNTOUCHED**" >> "$GITHUB_STEP_SUMMARY"
          echo "Validation mode complete. No changes made to Production."

      - name: Backup Production Database (Pre-Promotion Safety Gate)
        if: ${{ inputs.mode == 'promote' }}
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$POSTGRES_USER" ] || [ -z "$POSTGRES_PASSWORD" ]; then
            echo "::error::POSTGRES_USER / POSTGRES_PASSWORD secrets missing. Aborting promotion." >&2
            exit 1
          fi
          
          mkdir -p /root/mercon-db-backups
          PROD_BACKUP_PATH="/root/mercon-db-backups/prod-before-promote-${CHECKPOINT_STAMP}.dump"
          echo "Dumping production (mercon_db) to $PROD_BACKUP_PATH ..."
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" mercon-postgres \
            pg_dump -U "$POSTGRES_USER" -d mercon_db -Fc -f "/tmp/prod-backup.dump"
          docker cp mercon-postgres:/tmp/prod-backup.dump "$PROD_BACKUP_PATH"
          docker exec mercon-postgres rm -f /tmp/prod-backup.dump
          
          if [ ! -s "$PROD_BACKUP_PATH" ]; then
            echo "::error::Production database backup failed or produced empty file. Aborting before touching production." >&2
            exit 1
          fi
          
          echo "PROD_BACKUP_PATH=$PROD_BACKUP_PATH" >> "$GITHUB_ENV"
          echo "Production backup complete: $PROD_BACKUP_PATH ($(du -h "$PROD_BACKUP_PATH" | cut -f1))"

      - name: Fast-Forward Main Branch to Checkpoint SHA (NO Force Push)
        if: ${{ inputs.mode == 'promote' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Fast-forwarding main branch to Checkpoint commit $CHECKPOINT_COMMIT_SHA..."
          git push origin "${CHECKPOINT_COMMIT_SHA}:refs/heads/main"
          echo "Branch main successfully updated to Checkpoint commit $CHECKPOINT_COMMIT_SHA."

      - name: Deploy Production Code & Apply Prisma Migrations to PROD Database
        if: ${{ inputs.mode == 'promote' }}
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          ICCES_USER: ${{ secrets.ICCES_USER }}
          ICCES_PASS: ${{ secrets.ICCES_PASS }}
          ICCES_ACCT: ${{ secrets.ICCES_ACCT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'AQ.Ab8RN6K3a4t83gB0yRI607axYGS8_JJIHhRuJZkYkLwxDDsNZA' }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-flash-latest' }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          echo "Deploying production stack for Checkpoint SHA $CHECKPOINT_COMMIT_SHA..."
          git checkout "$CHECKPOINT_COMMIT_SHA"
          
          echo "Building production Docker containers..."
          docker compose up -d --build
          
          sleep 8
          echo "Production containers running."

      - name: Fatal Production Health Verification
        if: ${{ inputs.mode == 'promote' }}
        run: |
          set -euo pipefail
          echo "Verifying production API health endpoint..."
          sleep 5
          
          HEALTH_RESPONSE=$(curl -fsS http://127.0.0.1:3050/health 2>/dev/null || curl -fsS http://localhost:3050/health 2>/dev/null || echo "FAILED")
          echo "Production Health Check Output: $HEALTH_RESPONSE"
          
          if [ "$HEALTH_RESPONSE" = "FAILED" ]; then
            echo "::error::Production API health check failed! Printing container logs..." >&2
            docker compose logs --tail=100 mercon-api || true
            echo "Rollback command: docker exec -e PGPASSWORD=\"\$POSTGRES_PASSWORD\" mercon-postgres pg_restore --clean --if-exists --no-owner --no-privileges -U \"\$POSTGRES_USER\" -d mercon_db < $PROD_BACKUP_PATH" >&2
            exit 1
          fi
          
          echo "Production API is HEALTHY."

      - name: Final Promotion Summary
        if: ${{ inputs.mode == 'promote' }}
        run: |
          {
            echo "## Dev Checkpoint → Production Promotion Complete"
            echo ""
            echo "- **Checkpoint ID**: \`$CHECKPOINT_ID\`"
            echo "- **Pinned Git SHA**: \`$CHECKPOINT_COMMIT_SHA\`"
            echo "- **Production Pre-Backup**: \`$PROD_BACKUP_PATH\`"
            echo "- **Main Branch**: Fast-forwarded to \`$CHECKPOINT_COMMIT_SHA\`"
            echo "- **Production Business Data**: **100% INTACT & PRESERVED**"
            echo "- **Sentinel Drift Analysis**: **$SENTINEL_VERDICT**"
            echo "- **Production Health**: **HEALTHY (200 OK)**"
            echo ""
            echo "### Pre-Promotion Backup File"
            echo "\`$PROD_BACKUP_PATH\`"
          } >> "$GITHUB_STEP_SUMMARY"
