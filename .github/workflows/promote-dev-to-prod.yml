name: Promote Dev Checkpoint to Production

# Safe DEV Checkpoint & Production Promotion System
#
# Concepts:
# 1. DEV continuously receives development changes.
# 2. When DEV reaches a stable state, a CHECKPOINT is captured (Git SHA + DB Snapshot).
# 3. Sentinel READ-ONLY gate validates the checkpoint before touching production.
# 4. Production is backed up, updated to the exact Checkpoint DB snapshot, and main is aligned.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type OVERWRITE PRODUCTION to confirm promotion.'
        required: true
        default: ''
        type: string
      mode:
        description: 'Action mode: "promote" (full backup + promotion) or "validate_only" (creates checkpoint & validates without touching prod)'
        required: true
        default: 'promote'
        type: choice
        options:
          - promote
          - validate_only

concurrency:
  group: ci-cd-main
  cancel-in-progress: false

jobs:
  checkpoint-promote:
    name: DEV Checkpoint & Production Promotion
    runs-on: self-hosted

    steps:
      - name: Verify Confirmation Phrase
        run: |
          set -euo pipefail
          RAW_CONFIRM="${{ inputs.confirm }}"
          CLEAN_CONFIRM=$(echo "$RAW_CONFIRM" | sed 's/ to proceed\.//i' | xargs)
          
          if [ "${{ inputs.mode }}" = "promote" ]; then
            if [ "$CLEAN_CONFIRM" != "OVERWRITE PRODUCTION" ]; then
              echo "::error::Confirmation phrase did not match 'OVERWRITE PRODUCTION'. Received: '$RAW_CONFIRM'. Aborting — no data was touched." >&2
              exit 1
            fi
            echo "Confirmation phrase validated successfully for promotion."
          else
            echo "Running in validate_only mode. Proceeding with Checkpoint creation and Sentinel validation."
          fi

      - name: Native Git Checkout & Pinned SHA Extraction
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=safe.directory
          export GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE"
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if [ -d .git ]; then
            git remote set-url origin "$REPO_URL"
            git fetch --force --prune origin dev
            git checkout --force origin/dev
          else
            git init -q
            git remote add origin "$REPO_URL"
            git fetch --depth 1 origin dev
            git checkout --force FETCH_HEAD
          fi
          
          CHECKPOINT_COMMIT_SHA=$(git rev-parse HEAD)
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          CHECKPOINT_ID="chk-${STAMP}-${CHECKPOINT_COMMIT_SHA:0:7}"
          
          echo "CHECKPOINT_COMMIT_SHA=$CHECKPOINT_COMMIT_SHA" >> "$GITHUB_ENV"
          echo "CHECKPOINT_ID=$CHECKPOINT_ID" >> "$GITHUB_ENV"
          echo "CHECKPOINT_STAMP=$STAMP" >> "$GITHUB_ENV"
          
          echo "Checkpoint SHA: $CHECKPOINT_COMMIT_SHA"
          echo "Checkpoint ID:  $CHECKPOINT_ID"

      - name: Create Immutable Database Snapshot Checkpoint
        env:
          DEV_POSTGRES_USER: ${{ secrets.DEV_POSTGRES_USER || secrets.POSTGRES_USER || 'mercon_dev_admin' }}
          DEV_POSTGRES_PASSWORD: ${{ secrets.DEV_POSTGRES_PASSWORD || secrets.POSTGRES_PASSWORD || 'mercon_dev_secure_pass_2026' }}
        run: |
          set -euo pipefail
          mkdir -p /root/mercon-db-backups
          CHECKPOINT_DB_PATH="/root/mercon-db-backups/${CHECKPOINT_ID}-dev.dump"
          
          echo "Creating immutable dev database snapshot at $CHECKPOINT_DB_PATH ..."
          docker exec -e PGPASSWORD="$DEV_POSTGRES_PASSWORD" dev-postgres \
            pg_dump -U "$DEV_POSTGRES_USER" -d mercon_dev_db -Fc -f "/tmp/${CHECKPOINT_ID}.dump"
          docker cp dev-postgres:/tmp/${CHECKPOINT_ID}.dump "$CHECKPOINT_DB_PATH"
          docker exec dev-postgres rm -f /tmp/${CHECKPOINT_ID}.dump
          
          if [ ! -s "$CHECKPOINT_DB_PATH" ]; then
            echo "::error::DEV database dump failed or produced an empty file. Aborting promotion." >&2
            exit 1
          fi
          
          echo "CHECKPOINT_DB_PATH=$CHECKPOINT_DB_PATH" >> "$GITHUB_ENV"
          echo "Immutable database checkpoint created: $CHECKPOINT_DB_PATH ($(du -h "$CHECKPOINT_DB_PATH" | cut -f1))"

      - name: Sentinel READ-ONLY Validation Gate
        env:
          DEV_POSTGRES_USER: ${{ secrets.DEV_POSTGRES_USER || secrets.POSTGRES_USER || 'mercon_dev_admin' }}
          DEV_POSTGRES_PASSWORD: ${{ secrets.DEV_POSTGRES_PASSWORD || secrets.POSTGRES_PASSWORD || 'mercon_dev_secure_pass_2026' }}
        run: |
          set -euo pipefail
          echo "=== SENTINEL PRE-PROMOTION CHECK ==="
          
          # 1. Verify Prisma migration ledger in dev database has zero failed migrations
          FAILED_COUNT=$(docker exec -e PGPASSWORD="$DEV_POSTGRES_PASSWORD" dev-postgres psql -U "$DEV_POSTGRES_USER" -d mercon_dev_db -t -c "
            SELECT COUNT(*) FROM _prisma_migrations WHERE finished_at IS NULL AND rolled_back_at IS NULL;
          " | tr -d '[:space:]' || echo "1")
          
          if [ "$FAILED_COUNT" -ne 0 ]; then
            echo "::error::Sentinel Gate: Found $FAILED_COUNT un-resolved failed migration(s) in dev database. Aborting promotion." >&2
            exit 1
          fi
          
          # 2. Verify critical physical tables exist
          TABLE_COUNT=$(docker exec -e PGPASSWORD="$DEV_POSTGRES_PASSWORD" dev-postgres psql -U "$DEV_POSTGRES_USER" -d mercon_dev_db -t -c "
            SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('User', 'Settings', 'Trip');
          " | tr -d '[:space:]' || echo "0")
          
          if [ "$TABLE_COUNT" -lt 3 ]; then
            echo "::error::Sentinel Gate: Essential tables (User, Settings, Trip) missing in dev database. Aborting promotion." >&2
            exit 1
          fi
          
          echo "Sentinel READ-ONLY validation PASSED cleanly."

      - name: Validate-Only Mode Early Completion
        if: ${{ inputs.mode == 'validate_only' }}
        run: |
          echo "## Checkpoint Validation Successful (Dry-Run)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Checkpoint ID: \`$CHECKPOINT_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Git SHA: \`$CHECKPOINT_COMMIT_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- DB Dump: \`$CHECKPOINT_DB_PATH\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sentinel Gate: **PASSED**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production: **UNTOUCHED**" >> "$GITHUB_STEP_SUMMARY"
          echo "Validation mode complete. No changes made to Production."

      - name: Backup Production Database (Pre-Promotion Safety Gate)
        if: ${{ inputs.mode == 'promote' }}
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$POSTGRES_USER" ] || [ -z "$POSTGRES_PASSWORD" ]; then
            echo "::error::POSTGRES_USER / POSTGRES_PASSWORD secrets missing. Aborting promotion." >&2
            exit 1
          fi
          
          PROD_BACKUP_PATH="/root/mercon-db-backups/prod-before-promote-${CHECKPOINT_STAMP}.dump"
          echo "Dumping production (mercon_db) to $PROD_BACKUP_PATH ..."
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" mercon-postgres \
            pg_dump -U "$POSTGRES_USER" -d mercon_db -Fc -f "/tmp/prod-backup.dump"
          docker cp mercon-postgres:/tmp/prod-backup.dump "$PROD_BACKUP_PATH"
          docker exec mercon-postgres rm -f /tmp/prod-backup.dump
          
          if [ ! -s "$PROD_BACKUP_PATH" ]; then
            echo "::error::Production database backup failed or produced empty file. Aborting before touching production." >&2
            exit 1
          fi
          
          echo "PROD_BACKUP_PATH=$PROD_BACKUP_PATH" >> "$GITHUB_ENV"
          echo "Production backup complete: $PROD_BACKUP_PATH ($(du -h "$PROD_BACKUP_PATH" | cut -f1))"

      - name: Promote Immutable Checkpoint Database to Production
        if: ${{ inputs.mode == 'promote' }}
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Restoring Checkpoint snapshot $CHECKPOINT_DB_PATH into Production (mercon_db)..."
          docker cp "$CHECKPOINT_DB_PATH" mercon-postgres:/tmp/checkpoint.dump
          
          set +e
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" mercon-postgres \
            pg_restore --clean --if-exists --no-owner --no-privileges \
            -U "$POSTGRES_USER" -d mercon_db /tmp/checkpoint.dump
          RESTORE_EXIT=$?
          set -e
          
          docker exec mercon-postgres rm -f /tmp/checkpoint.dump
          
          if [ "$RESTORE_EXIT" -gt 1 ]; then
            echo "::error::pg_restore failed with exit code $RESTORE_EXIT." >&2
            echo "Rollback command: docker exec -e PGPASSWORD=\"\$POSTGRES_PASSWORD\" mercon-postgres pg_restore --clean --if-exists --no-owner --no-privileges -U \"\$POSTGRES_USER\" -d mercon_db < $PROD_BACKUP_PATH" >&2
            exit 1
          fi
          
          echo "Production database successfully restored to Checkpoint $CHECKPOINT_ID."

      - name: Align Main Branch with Checkpoint Code State
        if: ${{ inputs.mode == 'promote' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Aligning main branch to Checkpoint commit $CHECKPOINT_COMMIT_SHA..."
          git push origin "${CHECKPOINT_COMMIT_SHA}:refs/heads/main" --force-with-lease || git push origin "${CHECKPOINT_COMMIT_SHA}:refs/heads/main"
          echo "Branch main successfully aligned to Checkpoint commit $CHECKPOINT_COMMIT_SHA."

      - name: Restart Production API & Verify Health
        if: ${{ inputs.mode == 'promote' }}
        run: |
          set -euo pipefail
          echo "Restarting production API container (mercon-api)..."
          docker restart mercon-api
          sleep 8
          
          HEALTH_STATUS=$(curl -fsS http://127.0.0.1:3050/health 2>/dev/null || echo "failed")
          echo "Production Health Status: $HEALTH_STATUS"
          
          if [ "$HEALTH_STATUS" = "failed" ]; then
            echo "::warning::Production health check returned no status. Printing container logs..."
            docker logs --tail=50 mercon-api || true
          fi

      - name: Final Promotion Summary
        if: ${{ inputs.mode == 'promote' }}
        run: |
          {
            echo "## Dev Checkpoint → Production Promotion Complete"
            echo ""
            echo "- **Checkpoint ID**: \`$CHECKPOINT_ID\`"
            echo "- **Pinned Git SHA**: \`$CHECKPOINT_COMMIT_SHA\`"
            echo "- **Dev DB Snapshot**: \`$CHECKPOINT_DB_PATH\`"
            echo "- **Production Backup**: \`$PROD_BACKUP_PATH\`"
            echo "- **Main Branch**: Updated to \`$CHECKPOINT_COMMIT_SHA\`"
            echo "- **Sentinel Validation**: PASSED"
            echo ""
            echo "### Rollback Command (if ever needed)"
            echo "\`\`\`bash"
            echo "docker exec -e PGPASSWORD=\"\$POSTGRES_PASSWORD\" mercon-postgres pg_restore --clean --if-exists --no-owner --no-privileges -U \"\$POSTGRES_USER\" -d mercon_db < $PROD_BACKUP_PATH"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
