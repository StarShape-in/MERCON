# Refreshes the production environment with a snapshot of dev data:
# every table in mercon_dev_db and dev uploaded document files.
# Manual execution only via workflow_dispatch — requires typing "OVERWRITE PRODUCTION DATA".
name: Sync Prod DB from Dev

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type OVERWRITE PRODUCTION DATA to confirm — this replaces all data in production'
        required: true
        type: string

jobs:
  sync:
    name: Sync prod from dev
    runs-on: self-hosted

    steps:
      - name: Verify confirmation
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "OVERWRITE PRODUCTION DATA" ]; then
            echo "::error::Confirmation mismatch. You must type exactly 'OVERWRITE PRODUCTION DATA'." >&2
            exit 1
          fi

      - name: Verify containers are running
        run: |
          set -euo pipefail
          for c in mercon-postgres dev-postgres; do
            if [ "$(docker inspect -f '{{.State.Running}}' "$c" 2>/dev/null)" != "true" ]; then
              echo "::error::Container '$c' is not running." >&2
              exit 1
            fi
          done

      - name: Backup existing production database before overwrite
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'mercon_admin' }}
        run: |
          set -euo pipefail
          echo "Creating safety backup of production database before overwrite..."
          docker exec mercon-postgres pg_dump -U "$POSTGRES_USER" -Fc -d mercon_db > "/tmp/mercon-prod-pre-sync-backup-$(date +%Y%m%d%H%M%S).dump" || true

      - name: Dump dev database
        env:
          DEV_POSTGRES_USER: ${{ secrets.DEV_POSTGRES_USER || secrets.POSTGRES_USER || 'mercon_dev_admin' }}
        run: |
          set -euo pipefail
          docker exec dev-postgres pg_dump -U "$DEV_POSTGRES_USER" -Fc -d mercon_dev_db > /tmp/mercon-dev-sync.dump
          echo "Dev dump size: $(du -h /tmp/mercon-dev-sync.dump | cut -f1)"

      - name: Restore into production database
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'mercon_admin' }}
        run: |
          set -euo pipefail
          docker cp /tmp/mercon-dev-sync.dump mercon-postgres:/tmp/mercon-dev-sync.dump
          docker exec mercon-postgres pg_restore \
            --clean --if-exists --no-owner --no-privileges \
            -U "$POSTGRES_USER" -d mercon_db /tmp/mercon-dev-sync.dump
          docker exec mercon-postgres rm -f /tmp/mercon-dev-sync.dump
          rm -f /tmp/mercon-dev-sync.dump

      - name: Sync uploaded document files
        run: |
          set -euo pipefail
          mkdir -p /tmp/mercon-uploads /tmp/uploads
          rsync -a --delete /tmp/dev-uploads/ /tmp/mercon-uploads/ 2>/dev/null || true
          rsync -a --delete /tmp/mercon-dev-tmp-uploads/ /tmp/uploads/ 2>/dev/null || true
          echo "Uploaded files synced."

      - name: Restart production app container
        run: |
          set -euo pipefail
          docker restart mercon-api mercon-frontend 2>/dev/null || docker restart mercon-api || true

      - name: Summary
        run: |
          {
            echo "## Production synced from Dev"
            echo
            echo "Production database and uploaded files now mirror Dev as of $(date -u +%Y-%m-%dT%H:%M:%SZ)."
          } >> "$GITHUB_STEP_SUMMARY"
