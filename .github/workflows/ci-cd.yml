name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Deploy to Self-Hosted Runner
    runs-on: self-hosted
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Rebuild and Restart Docker Containers
        run: |
          echo "Rebuilding backend and frontend services..."
          cd backend/api-server
          
          # Remove old containers to force clean restart
          docker rm -f mercon-postgres mercon-api mercon-frontend || true
          
          # Build and start services in detached mode
          docker-compose up -d --build

      - name: Update Nginx Configuration
        run: |
          echo "Updating Nginx configuration..."
          cd backend/api-server
          cp mercon.tech.conf /etc/nginx/sites-available/mercon.tech.conf
          ln -sf /etc/nginx/sites-available/mercon.tech.conf /etc/nginx/sites-enabled/
          nginx -t && systemctl reload nginx
