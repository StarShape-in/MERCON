name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-ci:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/api-server
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: './backend/api-server/package-lock.json'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build TypeScript
      run: npm run build --if-present

  frontend-ci:
    name: Build Frontend (Web Dashboard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/web-dashboard
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        
    - name: Install dependencies
      run: npm install --legacy-peer-deps
      
    - name: Build Vite App
      run: npm run build --if-present

  deploy-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    # Only run deployment when pushing directly to the main branch
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy project files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "."
          target: "${{ secrets.VPS_PROJECT_PATH || '/root/mercon' }}"
          
      - name: Restart Docker Containers
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # Default to /root/mercon if the path secret isn't provided
            PROJECT_PATH="${{ secrets.VPS_PROJECT_PATH }}"
            if [ -z "$PROJECT_PATH" ]; then
              PROJECT_PATH="/root/mercon"
            fi
            
            echo "Navigating to $PROJECT_PATH"
            cd $PROJECT_PATH
            
            echo "Rebuilding and restarting backend services..."
            cd backend/api-server
            docker rm -f mercon-postgres mercon-api mercon-frontend || true
            docker-compose up -d --build

            echo "Updating Nginx configuration..."
            sudo cp mercon.tech.conf /etc/nginx/sites-available/mercon.tech.conf
            sudo ln -sf /etc/nginx/sites-available/mercon.tech.conf /etc/nginx/sites-enabled/
            sudo nginx -t && sudo systemctl reload nginx
