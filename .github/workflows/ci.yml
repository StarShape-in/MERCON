name: Monorepo CI Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  verify:
    name: Build, Typecheck & Validate Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Types
        run: npm run build:types

      - name: Generate Prisma Client
        run: cd backend/api-server && npx prisma generate

      - name: Typecheck Backend API Server
        run: cd backend/api-server && npx tsc --noEmit

      - name: Typecheck Frontend Web Dashboard
        run: cd frontend/web-dashboard && npx tsc --noEmit

      - name: Build All Monorepo Workspaces
        run: npm run build
