format_version: '11'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: android

meta:
  bitrise.io:
    stack: linux-docker-android-22.04

workflows:
  primary:
    summary: Build MERCON Driver Release APK
    description: Builds a universal release APK for the driver app
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - set-java-version@1:
        inputs:
        - set_java_version: '17'
    - script@1:
        title: Prebuild & Build Driver APK
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex

            cd frontend/mobile-app/mercon-app
            npm install
            npx expo prebuild --platform android --no-install

            cd android
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon

            mkdir -p "$BITRISE_DEPLOY_DIR"
            cp app/build/outputs/apk/release/*.apk "$BITRISE_DEPLOY_DIR/mercon-driver-app.apk"
            echo "APK copied to deploy directory successfully."
    - deploy-to-bitrise-io@2:
        inputs:
        - is_enable_public_page: 'true'
